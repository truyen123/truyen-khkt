<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>StudyGuard - Kiosk Toàn Màn Hình</title>
<style>
:root{--bg:#0d1319;--panel:#151d26;--panel2:#1b2631;--line:#26323f;--text:#e8eef4;--muted:#8a9aab;--brand:#2dd4bf;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.3 system-ui,"Segoe UI",sans-serif;user-select:none}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.on{background:var(--ok)}.dot.bad{background:var(--bad)}
main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex:1;overflow:hidden;padding:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;overflow:auto}
.panel h3{margin:0 0 6px 0;font-size:13px;color:var(--muted);font-weight:600}
.video{background:#000;border-radius:8px;overflow:hidden;flex:1;min-height:0}
.video img{width:100%;height:100%;object-fit:contain;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.stat small{color:var(--muted);display:block;font-size:11px}
.stat b{display:block;font-size:18px;font-weight:700}
.chatbox{display:flex;flex-direction:column;flex:1;min-height:0}
#chatLog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px;font-size:12px}
.m{padding:6px 8px;border-radius:8px;word-wrap:break-word}
.m.u{align-self:flex-end;background:#0f766e;color:#fff;max-width:85%}
.m.a{align-self:flex-start;background:var(--panel2);max-width:85%}
.ask{display:flex;gap:6px;margin-top:auto}
input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;min-width:0}
.ask input{flex:1}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{background:var(--brand);color:#06201d;border:0;border-radius:6px;padding:8px 10px;font-weight:600;font-size:12px;cursor:pointer}
button.g{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.r{background:var(--bad);color:#fff}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.switch-group{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12px}
.sw{width:40px;height:22px;accent-color:var(--brand)}
.info-row{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.info-row b{color:var(--brand)}
.chip{padding:4px 8px;border-radius:6px;font-weight:600;font-size:11px;background:rgba(5,60,45,.9);color:#b8f5de;display:inline-block;margin-top:4px}
.chip.warn{background:rgba(120,70,5,.92);color:#ffe9b8}
.chip.danger{background:rgba(127,20,30,.94);color:#ffd5d9}
</style>
</head>
<body>
<div class="app">
<header>
  <b>🎓 StudyGuard</b>
  <span><span class="dot" id="dCam"></span>Cam</span>
  <span><span class="dot" id="dMic"></span>Mic</span>
  <span><span class="dot" id="dSpk"></span>Loa</span>
  <span id="clock" style="margin-left:auto;font-variant-numeric:tabular-nums">--:--</span>
</header>
<main>
  <!-- Cột 1: Camera + Thống kê -->
  <div class="panel">
    <h3>📹 Camera</h3>
    <div class="video"><img id="live" src="/video_feed" alt="camera"></div>
    <div id="chip" class="chip">Đang kết nối…</div>
    <h3 style="margin-top:8px">📊 Hôm nay</h3>
    <div class="stats">
      <div class="stat"><small>Học</small><b id="sToday">—</b></div>
      <div class="stat"><small>7 ngày</small><b id="sWeek">—</b></div>
      <div class="stat"><small>Sai tư</small><b id="sPosture">0</b></div>
      <div class="stat"><small>Điện thoại</small><b id="sPhone">0</b></div>
    </div>
  </div>

  <!-- Cột 2: Chat -->
  <div class="panel">
    <h3>💬 Trò chuyện</h3>
    <div class="chatbox">
      <div id="chatLog"></div>
      <form id="askForm" class="ask">
        <input id="q" maxlength="500" placeholder="Gửi câu hỏi…" autocomplete="off">
        <button type="submit">Gửi</button>
      </form>
    </div>
  </div>

  <!-- Cột 3: Điều khiển + Hệ thống -->
  <div class="panel">
    <h3>⚙️ Điều khiển</h3>
    <div class="box">
      <div class="switch-group"><span>Camera</span><input class="sw" type="checkbox" id="camEn"></div>
      <div class="switch-group"><span>Micro</span><input class="sw" type="checkbox" id="micEn"></div>
      <div class="switch-group"><span>Loa</span><input class="sw" type="checkbox" id="spkEn"></div>
      <div class="switch-group"><span>Nhắc nhở</span><input class="sw" type="checkbox" id="vaEn"></div>
    </div>
    <div class="buttons">
      <button onclick="testSpeaker()">🔊 Test Loa</button>
      <button class="g" onclick="testMic()">🎤 Test Mic</button>
      <button class="r" onclick="saveSettings()">💾 Lưu</button>
      <button class="g" onclick="location.href='http://192.168.1.13:5000'">⚙️ Web Quản Lý</button>
    </div>

    <h3 style="margin-top:8px">🖥️ Hệ thống</h3>
    <div class="info-row"><span>Web:</span><b id="ip">—</b></div>
    <div class="info-row"><span>CPU:</span><b id="cpu">—</b></div>
    <div class="info-row"><span>RAM:</span><b id="ram">—</b></div>
    <div class="info-row"><span>Nhiệt:</span><b id="temp">—</b></div>
    <div class="info-row"><span>Phát hiện:</span><b id="det">—</b></div>
    
    <h3 style="margin-top:8px">👤 Trợ lý</h3>
    <div style="font-size:12px;color:var(--muted)">
      <div id="asst">—</div>
    </div>
  </div>
</main>
</div>

<script>
const $ = id => document.getElementById(id);

function toast(m) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:9999';
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Cập nhật đồng hồ
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
}, 1000);

// Render dữ liệu
function render(d) {
  $('chip').textContent = d.status;
  $('chip').className = 'chip ' + (d.type === 'success' ? '' : d.type);
  
  $('dCam').className = 'dot ' + (d.camera_ok ? 'on' : 'bad');
  $('dMic').className = 'dot ' + (d.mic_on ? 'on' : '');
  $('dSpk').className = 'dot ' + (d.speaker_on ? 'on' : '');
  
  $('sToday').textContent = d.study_text;
  $('sWeek').textContent = d.week_text;
  $('sPosture').textContent = d.posture_count;
  $('sPhone').textContent = d.phone_count;
  
  const a = d.assistant || {};
  $('asst').textContent = (a.state || '—') + (a.last_heard ? ' · nghe: "' + a.last_heard + '"' : '');
  
  renderChat(d.chat || []);
  
  const s = d.system || {};
  $('ip').textContent = 'http://' + s.ip + ':' + s.port;
  $('cpu').textContent = s.cpu != null ? s.cpu + '%' : '—';
  $('ram').textContent = s.ram != null ? s.ram + '%' : '—';
  $('temp').textContent = s.temp != null ? s.temp + ' °C' : '—';
  $('det').textContent = d.phone_detector || '—';
}

// Chat
let lastChatKey = '';
function renderChat(chat) {
  const key = JSON.stringify(chat.map(c => c.created_at));
  if (key === lastChatKey) return;
  lastChatKey = key;
  
  const l = $('chatLog');
  l.replaceChildren();
  chat.forEach(c => {
    const u = document.createElement('div');
    u.className = 'm u';
    u.textContent = c.user_text;
    const a = document.createElement('div');
    a.className = 'm a';
    a.textContent = c.assistant_text;
    l.append(u, a);
  });
  l.scrollTop = l.scrollHeight;
}

$('askForm').onsubmit = e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('q').value = '';
  
  const l = $('chatLog');
  const u = document.createElement('div');
  u.className = 'm u';
  u.textContent = q;
  const a = document.createElement('div');
  a.className = 'm a';
  a.textContent = '⏳ Đang suy nghĩ…';
  l.append(u, a);
  l.scrollTop = l.scrollHeight;
  
  fetch('/api/assistant/ask', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q})
  })
    .then(r => r.json().then(j => ({ok: r.ok, j})))
    .then(({ok, j}) => {
      a.textContent = ok ? j.answer : '❌ ' + (j.error || 'Lỗi');
      lastChatKey = '';
      l.scrollTop = l.scrollHeight;
    })
    .catch(err => {
      a.textContent = '❌ ' + err.message;
    });
};

// Settings
function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  }).then(r => r.json().then(j => ({ok: r.ok, j})));
}

function loadSettings() {
  fetch('/api/settings').then(r => r.json()).then(j => {
    const s = j.settings;
    if (!s) return;
    $('camEn').checked = s.camera_enabled;
    $('micEn').checked = s.microphone_enabled;
    $('spkEn').checked = s.speaker_enabled;
    $('vaEn').checked = s.voice_alerts;
  }).catch(() => toast('Không tải được cài đặt'));
}

function saveSettings() {
  post('/api/settings', {
    camera_enabled: $('camEn').checked,
    microphone_enabled: $('micEn').checked,
    speaker_enabled: $('spkEn').checked,
    voice_alerts: $('vaEn').checked
  }).then(({ok, j}) => toast(ok ? 'Đã lưu' : (j.error || 'Lỗi lưu')));
}

function testSpeaker() {
  toast('Đang đọc thử…');
  post('/api/test/voice', {}).then(({ok, j}) => {
    toast(ok ? 'Đã đọc thử' : (j.error || 'Lỗi loa'));
  });
}

function testMic() {
  toast('Ghi âm 3 giây…');
  post('/api/test/mic', {}).then(({ok, j}) => {
    toast(ok ? 'Đã ghi âm' : (j.error || 'Lỗi mic'));
  });
}

// Poll
function poll() {
  fetch('/api/kiosk').then(r => r.json()).then(render).catch(() => {
    $('chip').textContent = 'Mất kết nối server…';
    $('chip').className = 'chip danger';
  });
}

setInterval(poll, 2000);
loadSettings();
poll();
</script>
</body>
</html>
